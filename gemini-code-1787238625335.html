<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 2.5 Voice App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Gemini 2.5 Assistant</h2>
    
    <input type="password" id="apiKey" placeholder="Paste your Google AI Studio Key" />
    <textarea id="userInput" placeholder="Ask Gemini something..."></textarea>
    
    <button id="submitBtn">Generate Response</button>

    <div class="status-box">
      <strong>Response:</strong>
      <div id="responseOutput">Waiting for prompt...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
